<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>@@TITLE@@</title>
<style>
[hidden]{display:none!important}
body{max-width:1100px;margin:auto;padding:16px 22px;background:#f6f2e8;color:#344734;font:16px/1.6 sans-serif}
h1{font-size:25px;margin:8px 0}h2{font-size:19px;margin:12px 0}
details{font-size:13px;margin:6px 0}code{overflow-wrap:anywhere}pre{white-space:pre-wrap}
.view-tabs,.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin:12px 0}
button,select{padding:8px 12px;border:1px solid #ced1bf;border-radius:7px;background:#fffdf7;color:#344734;cursor:pointer}
.view-tabs button.active{background:#607d4a;color:white}
input{width:42%;accent-color:#607d4a}
img{display:block;max-width:100%;height:auto}
canvas{display:block;max-width:100%;max-height:min(56vh,520px);width:auto;height:auto;margin:auto}
.note{padding:12px;background:#eae6d9}section>p{font-size:13px}
</style>
<h1>@@TITLE@@</h1>
<details><summary>模型来源与核验说明</summary>@@SOURCE_INFO@@</details>
<nav class="view-tabs">@@NAV@@</nav>
@@COMPARISON@@
@@MODEL_VIEW@@
@@GALLERY@@
@@LICENSES@@
@@SCRIPTS@@
</html>
